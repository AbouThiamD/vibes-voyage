<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Modifier la vidéo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/CSS/connexion.css"> 
    <link rel="stylesheet" href="/CSS/header.css"> 
  
</head>
<body>

  <header th:replace="~{header :: siteHeader('videoedit')}"></header>
<div class="watch-wrap">
    
    <div class="form-wrapper"> 

        <div th:if="${succMsg}" class="alert alert-success" th:text="${succMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

        <h1 class="watch-title">Modifier la vidéo</h1>

        <form th:action="@{|/video/${v.id}/edit|}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

            <div class="form-group">
                <label for="titre">Titre</label> <input type="text" id="titre" name="titre" th:value="${v.nomVideo}" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" class="form-control" th:text="${v.description}"></textarea>
            </div>

            <div class="form-group">
                <label for="categorie">Catégorie</label>
                <select id="categorie" name="categorieId" class="form-control" required>
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:selected="${v.categorie != null and c.id == v.categorie.id}"
                            th:text="${c.nomCategorie}">
                    </option>
                </select>
            </div>

            <hr>

            <div class="form-group">
                <label>Image actuelle :</label>
                <div th:if="${v != null and v.image != null}">
                    <img th:src="${v.image}" alt="miniature" class="image-preview">
                </div>
                <label for="imageFile">Remplacer l’image (optionnel)</label>
                <input type="file" id="imageFile" name="imageFile" accept="image/*" class="form-control-file">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/videos}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>

        
    
    </div> </div>
     <footer class="main-footer">
    <div class="container">
      <p>&copy; 2025 Vibes Voyage. Tous droits réservés.</p>
      <div class="footer-links">
        <a href="#">À propos</a>
        <a href="#">Aide</a>
        <a href="#">Conditions d'utilisation</a>
      </div>
    </div>
    <script defer th:src="@{/JS/header.js}"></script>
  </footer>
 </body>
</html>
