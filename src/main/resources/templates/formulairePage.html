<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@500;700&display=swap" rel="stylesheet">
 
   <link rel="stylesheet" href="CSS/header.css" th:href="@{/CSS/header.css}">
    <link rel="stylesheet" href="CSS/formulairePage.css" th:href="@{/CSS/formulairepage.css}">
  <title>Vibes Voyage | Ajouter video</title>
</head>
<body>
  <header th:replace="~{header :: siteHeader('formulaire')}"></header>

  <main class="upload-container">
    <div class="form-wrapper">
        <header class="form-header">
            <h1>Ajouter une nouvelle vidéo</h1>
            <p>Remplissez les informations ci-dessous pour partager votre voyage.</p>
        </header>

        <form th:action="@{/video/save}" method="post" enctype="multipart/form-data" class="video-form">

            <div class="form-group">
                <label for="titre">Titre de la vidéo</label>
                <input type="text" id="titre" name="titre" placeholder="Ex: Mon incroyable voyage en Italie" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" placeholder="Décrivez votre vidéo, les lieux visités, vos impressions..."></textarea>
            </div>

            <div class="form-group">
                <label for="categorie">Catégorie</label>
                <select id="categorie" name="categorieId" required>
                    <option value="" disabled selected>Choisir une destination...</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.nomCategorie}">Europe</option>
                    
                </select>
            </div>

            <div class="form-group">
                <label for="videoFile">Fichier de la vidéo</label>
                <input type="file" id="videoFile" name="videoFile" accept="video/*" required>
            </div>

            <div class="form-group">
                <label for="imageFile">Image de couverture (Miniature)</label>
                <input type="file" id="imageFile" name="imageFile" accept="image/*" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Publier la vidéo</button>
            </div>

        </form>
    </div>
</main>
    <footer class="main-footer">
    <div class="container">
      <p>&copy; 2025 Vibes Voyage. Tous droits réservés.</p>
      <div class="footer-links"><a href="#">À propos</a><a href="#">Aide</a><a href="#">Conditions d'utilisation</a></div>
    </div>
  </footer>
  <script defer th:src="@{/JS/header.js}"></script>
</body>
