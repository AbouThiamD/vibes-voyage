<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${(v != null ? v.nomVideo : 'Vidéo')} + ' | Vibes Voyage'">Vibes Voyage | Vidéo</title>


  <link rel="stylesheet" href="/CSS/VideoDetail.css" th:href="@{/CSS/VideoDetail.css}">
    <link rel="stylesheet" href="/CSS/header.css" th:href="@{/CSS/header.css}">
</head>
<body>
  <header th:replace="~{header :: siteHeader('videodetail')}"></header>

  <main class="watch"
        th:with="
          posterUrl = ${(v != null and v.image != null and !#strings.isEmpty(v.image))}
                      ? ${v.image}
                      : '/IMAGES/Continents/afrique-hero.jpg',
          isWebm    = ${v != null and v.url != null and #strings.endsWith(#strings.toLowerCase(v.url), '.webm')}
        ">

    <div class="watch-wrap" th:if="${v != null}">

      <div class="watch-grid">

        <div class="watch-player">
  <video id="player" controls preload="metadata" playsinline
         
         th:attr="poster=${#strings.startsWith(posterUrl, '/')} 
                           ? @{${posterUrl}} 
                           : @{/uploads/{path}(path=${posterUrl})}">
    
    <source th:src="@{/uploads/{path}(path=${v.url})}"
            th:attr="type=${isWebm} ? 'video/webm' : 'video/mp4'"/>
    
    Votre navigateur ne supporte pas la vidéo HTML5.
  </video>
</div>

        <div class="watch-left">
          <h1 class="watch-title" th:text="${v.nomVideo}">Titre de la vidéo</h1>
          <h2 class="watch-author" 
      th:if="${v.utilisateur != null}" 
      th:text="${v.utilisateur.pseudo}">
    Auteur
  </h2>
          <p class="watch-meta">
            
            <span class="badge" th:text="${v.categorie != null ? v.categorie.nomCategorie : 'Catégorie'}">Catégorie</span>
            <span class="date" th:if="${v.date != null}" th:text="${#dates.format(v.date, 'dd/MM/yyyy')}">01/01/2025</span>
          </p>
          <p class="watch-desc" th:if="${v.description != null}" th:text="${v.description}">
            Petite description de la vidéo…
          </p>
        </div>

      </div> </div> <div th:if="${v == null}" class="watch-error">
      Vidéo introuvable.
    </div>
  </main>

    <footer class="main-footer">
    <div class="container">
      <p>&copy; 2025 Vibes Voyage. Tous droits réservés.</p>
      <div class="footer-links">
        <a href="#">À propos</a>
        <a href="#">Aide</a>
        <a href="#">Conditions d'utilisation</a>
      </div>
    </div>
  </footer>
  <script defer th:src="@{/JS/header.js}"></script>
</body>
</html>
