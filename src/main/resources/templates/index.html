<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibes Voyage — Contact</title>

 
  <link rel="stylesheet" href="/CSS/header.css">
  
 
  <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

 
  <header th:replace="~{header :: siteHeader('contact')}"></header>

  <section class="contact-hero" role="img" aria-label="Image de voyage">
    <br>
    <img src="/IMAGES/afrique2.jpg" alt="Panorama de voyage">
  </section>

 
  <main class="contact-main">
    <section class="card container">
      <header class="contact-header">
        <div class="logo-line">
          <img src="/IMAGES/logo-Emmy.png" alt="Vibes Voyage">
          <strong>Vibes Voyage</strong>
        </div>
        <h1>Contact-nous</h1>
        <p class="lead">Une question ? Écris-nous, on répond vite.</p>
      </header>

      <th:block th:if="${succMsg}">
    <div class="message-succes" style="color: green; padding: 10px; border: 1px solid green; margin-bottom: 15px;">
        [[${succMsg}]]
    </div>
    </th:block>
    <th:block th:if="${errorMsg}">
    <div class="message-erreur" style="color: red; padding: 10px; border: 1px solid red; margin-bottom: 15px;">
        [[${errorMsg}]]
    </div>
</th:block>

      <form class="contact-form" th:action="@{/contact/send}" method="post" novalidate>
      <div class="field">
          <label for="name">Nom</label>
          <input id="name" name="name" type="text" placeholder="Votre nom" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="vous@exemple.com" required>
        </div>

        <div class="field field--full">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Écrivez votre message…" required></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary">Envoyer</button>
        </div>
      </form>
      

      <p class="backline">Besoin d’aide rapide ? <a href="/index.html">Retour à l’accueil</a></p>
    </section>
    
  </main>

    <footer class="main-footer">
    <div class="container">
      <p>&copy; 2025 Vibes Voyage. Tous droits réservés.</p>
      <div class="footer-links"><a href="#">À propos</a><a href="#">Aide</a><a href="#">Conditions d'utilisation</a></div>
    </div>
  </footer>


</body>
</html>
