<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@500;700&display=swap" rel="stylesheet">
    <title>Mon profil</title>
 <link rel="stylesheet" th:href="@{/CSS/header.css}" />
  <link rel="stylesheet" th:href="@{/CSS/profil.css}" />
    
</head>
<body>

<header th:replace="~{header :: siteHeader('profil')}"></header>

  
<form class="video-form" th:action="@{/profil}" method="post">
    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

    <div class="upload-container">
        <div class="form-wrapper">
            
            <div class="form-header">
                 <h1>Mon profil</h1>
                 <p>Modifie tes infos, tout en douceur ✨</p>
            </div>

            
            <div th:if="${succMsg}" class="alert alert-success" th:text="${succMsg}"></div>
            <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Pseudo</label>
                    <input type="text" name="pseudo" th:value="${u.pseudo}" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" th:value="${u.email}" required>
                </div>
            </div>

            <hr class="hr-cute">

            <span class="group-title">Changer de mot de passe (optionnel)</span>

            <div class="grid-2">
                <div class="form-group">
                    <label>Mot de passe actuel</label>
                    <input type="password" name="currentPassword">
                </div>
                <div class="form-group">
                    <label>Nouveau mot de passe</label>
                    <input type="password" name="newPassword">
                </div>
            </div>

            <div class="form-group">
                <label>Confirmer le nouveau mot de passe</label>
                <input type="password" name="confirmPassword">
                <div class="help">Assure-toi que ça matche 💕</div>
            </div>

            <div class="form-actions">
                <button class="btn-submit" type="submit">Enregistrer</button>
                <a class="btn btn-ghost" th:href="@{/card}">Annuler</a>
            </div>
        </div>
    </div>
</form>


<div class="delete-container" th:if="${u != null}">
    <form th:action="@{|/compte/${u.id}/delete|}" method="post"
          onsubmit="return confirm('Supprimer définitivement votre compte ?');">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
        <button class="danger" type="submit">Supprimer mon compte</button>
    </form>
</div>

<footer class="main-footer">
    <div class="container">
        <p>&copy; 2025 Vibes Voyage. Tous droits réservés.</p>
        <div class="footer-links">
            <a href="#">À propos</a>
            <a href="#">Aide</a>
            <a href="#">Conditions d'utilisation</a>
        </div>
    </div>
</footer>
  <script defer th:src="@{/JS/header.js}"></script>

</body>
</html>
