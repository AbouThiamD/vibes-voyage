<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tous les utilisateurs</title>

  <!-- Garde ton CSS existant -->
  <link rel="stylesheet" th:href="@{/CSS/all.css}">
  <!-- Si tu utilises des icônes (facultatif) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <header>
    <h1>Liste des utilisateurs</h1>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom d’utilisateur</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <!-- IMPORTANT : on boucle sur 'utilisateurs' (pas 'video') -->
        <tr th:each="u : ${utilisateurs}">
          <td th:text="${u.id}">1</td>

          <!-- Adapte ce champ au nom réel dans ta classe Utilisateur :
               le plus courant est 'username'. Si chez toi c'est 'login' ou 'nomUtilisateur',
               remplace juste 'username' ci-dessous. -->
          <td th:text="${u.username}">jdupont</td>

          <!-- Idem pour l'email : 'email' est courant. S'il s'appelle autrement,
               remplace simplement 'email'. -->
          <td th:text="${u.email}">jd@example.com</td>

          <td class="lienBlanc">
          
            <a th:href="@{/utilisateurs/{id}/delete(id=${u.id})}"
               onclick="return confirm('Supprimer cet utilisateur ?')" title="Supprimer">
              <i class="fa-solid fa-trash" style="color:red;"></i>
            </a>
          </td>
        </tr>

        <!-- Optionnel : message si liste vide -->
        <tr th:if="${#lists.isEmpty(utilisateurs)}">
          <td colspan="4">Aucun utilisateur.</td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
