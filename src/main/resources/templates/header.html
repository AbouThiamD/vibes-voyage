<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@500;700&display=swap" rel="stylesheet">

  <!-- CSS -->
 
   <link rel="stylesheet" href="CSS/header.css" th:href="@{/CSS/header.css}">
  <title>Vibes Voyage | Afrique</title>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/card" th:href="@{/card}">
        <img src="/IMAGES/logo-Emmy.png" th:src="@{/IMAGES/logo-Emmy.png}" alt="Vibes Voyage">
      </a>

    <nav class="nav" aria-label="Navigation principale">
        <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <ul class="menu" id="main-menu">
          <li><a href="/card" th:href="@{/card}">Accueil</a></li>

          <!-- Destination avec un seul contrôleur /continent?id=... -->
          <li class="has-submenu">
            <a th:href="@{/continent(nom='Afrique')}" class="menu-link" aria-haspopup="true" aria-expanded="false">Destination</a>

            <ul class="submenu" th:if="${categories}">
              <li th:each="c : ${categories}">
                <a th:href="@{/continent(id=${c.id})}" th:text="${c.nomCategorie}">Catégorie</a>
              </li>
            </ul>
          </li>

          <li><a href="/Tableau" th:href="@{/Tableau}">Tableau de bord</a></li>
          <li><a href="/Contact" th:href="@{/Contact}">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
