
<header class="site-header"
        xmlns:th="http://www.thymeleaf.org"
        th:fragment="siteHeader(active)">
  <div class="container">
    <a class="brand" th:href="@{/card}">
      <img th:src="@{/IMAGES/logo-Emmy.png}" alt="Vibes Voyage">
    </a>

    <nav class="nav" aria-label="Navigation principale">
      <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="menu" id="main-menu">
        <li>
          <a th:href="@{/card}"
             th:classappend="${active}=='accueil' ? ' active' : ''">
            Accueil
          </a>
        </li>

        <!-- Destination + sous-menu catégories si 'categories' est fourni au modèle -->
        <li class="has-submenu">
          <a th:href="@{/continent(nom='Afrique')}"
             class="menu-link" aria-haspopup="true" aria-expanded="false"
             th:classappend="${active}=='destination' ? ' active' : ''">
            Destination
          </a>

          <ul class="submenu" th:if="${categories}">
            <li th:each="c : ${categories}">
              <a th:href="@{/continent(id=${c.id})}" th:text="${c.nomCategorie}">Catégorie</a>
            </li>
          </ul>
        </li>

        <li>
          <a th:href="@{/Tableau}"
             th:classappend="${active}=='tableau' ? ' active' : ''">
            Tableau de bord
          </a>
        </li>

        <li>
          <a th:href="@{/Contact}"
             th:classappend="${active}=='contact' ? ' active' : ''">
            Contact
          </a>
           <form th:action="@{/logout}" method="post" style="display:inline">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Se déconnecter</button>
  </form>
        </li>
      </ul>
    </nav>
  </div>
</header>
