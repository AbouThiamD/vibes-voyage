<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${title} ?: 'Toutes les vidéos'">Toutes les vidéos</title>

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/CSS/header.css}" />
  <link rel="stylesheet" th:href="@{/CSS/videoAll.css}" />
</head>
<body>
  <header th:replace="~{header :: siteHeader('AllVideoUser')}"></header>

  <center>
      <div th:if="${succMsg}" class="alert alert-success" th:text="${succMsg}"></div>
      <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
</center>
  <main class="page">
    <header class="page-head">
      <div class="title">
        <h1 th:text="${title} ?: 'Toutes les vidéos'">Toutes les vidéos</h1>
        <small th:if="${selectedCategorieId != null}">• filtrées</small>
      </div>

      <form class="filters" method="get" th:action="@{/dashboard/mes-videos}">
        <div class="select">
          <select name="categorieId">
            <option value="">Toutes les catégories</option>
            <option th:each="c : ${categories}"
                    th:value="${c.id}"
                    th:selected="${selectedCategorieId != null} and (c.id == selectedCategorieId)"
                    th:text="${c.nomCategorie}">
              Catégorie
            </option>
          </select>
        </div>

        <noscript><button class="btn btn-ghost" type="submit">Filtrer</button></noscript>
        <a class="btn-reset" th:if="${selectedCategorieId != null}" th:href="@{/videos}">Réinitialiser</a>
      </form>
    </header>

    <div class="empty" th:if="${#lists.isEmpty(videos)}">Aucune vidéo trouvée.</div>

    <section class="grid" th:if="${!#lists.isEmpty(videos)}">
      <article class="card card--media" th:each="v : ${videos}">
        <div class="thumb">
              <img th:src="${#strings.isEmpty(v.image) ? 
                 '/IMAGES/Continents/afrique-hero.jpg' : 
                 '/uploads/' + v.image}"
     th:alt="${v.nomVideo} ?:'Vignette vidéo'">

          <!-- Overlay (titre + boutons) -->
          <div class="overlay">
            <h3 class="overlay-title" th:text="${v.nomVideo}">Titre de la vidéo</h3>
            
            <div class="actions actions-overlay">
              <!-- Éditer -->
              <a class="btn btn-glass" th:href="@{|/video/${v.id}/edit|}">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
                </svg>
                <span>Éditer</span>
              </a>

              <!-- Supprimer -->
               
              <form th:action="@{|/video/${v.id}/delete|}" method="post"
                    onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cette vidéo ?');">
                <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->
                <button type="submit" class="btn btn-glass btn-glass--danger">
                  <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 7h12v2H6V7zm2 4h2v7H8v-7zm6 0h2v7h-2v-7zM9 4h6l1 1h3v2H5V5h3l1-1z" fill="currentColor"/>
                  </svg>
                  <span>Supprimer</span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Meta sous la carte (facultatif) -->
        <div class="meta-bar">
          <span th:if="${v.categorie != null}" th:text="${v.categorie.nomCategorie}">Catégorie</span>
          <span th:if="${v.date != null}" th:text="${#dates.format(v.date,'dd/MM/yyyy')}">01/01/2025</span>
          <span class="video-author" 
                th:if="${v.utilisateur != null}" 
                th:text="${v.utilisateur.pseudo}">
            Auteur
          </span>

        </div>
      </article>
    </section>
  </main>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2025 Vibes Voyage. Tous droits réservés.</p>
      <div class="footer-links">
        <a href="#">À propos</a>
        <a href="#">Aide</a>
        <a href="#">Conditions d'utilisation</a>
      </div>
    </div>
  </footer>

    <script defer th:src="@{/JS/header.js}"></script>
</body>
</html>
