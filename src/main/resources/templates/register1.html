<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/bienvenue.css" />
    <title>Bienvenue</title>
  </head>
  <body>
    <header>
      <a href="#" class="titre">Vibes Voyage</a>
    </header>

    <section class="home" id="section">
      <img class="image-slide" src="IMAGES/beautiful-landscape-1927327_1280.jpg" alt="" srcset="">

      <div class="content">
        <h1>Incroyable.<br><span>Decouverte</span></h1>

        <div class="texteBi">
          <p>...</p>
        </div>

        <div class="center">
          <a href="#" id="show-login">Rejoindre</a>
        </div>

        <div class="popup">
          <div class="hero">
            <div class="form-box">
              <div class="close-btn">&times;</div>

              <div class="button-box">
                <div class="btn"></div>
                <button type="button" class="toggle-btn" onclick="login()">Se connecter</button>
                <button type="button" class="toggle-btn" onclick="register()">S'inscrire</button>
              </div>

              <div class="social-icons">
                <i class="bx bxl-facebook-circle"></i>
                <i class="bx bxl-instagram"></i>
                <i class="bx bxl-twitter"></i>
              </div>

              <!-- LOGIN -->
              <form method="post" id="login" class="input-group" th:action="@{/perform_login}">
                <input type="text" name="pseudo" class="input-field" placeholder="Votre login" required>
                <input type="password" name="mdp" class="input-field" placeholder="Votre Mot de passe" required>
                <!-- CSRF protégé -->
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="submit" name="sign-in" value="Se connecter" class="submit-btn">
              </form>

              <!-- REGISTER -->
              <form method="post" id="register" class="input-group" th:action="@{/register}">
                <input type="text" name="email" class="input-field" placeholder="Votre E-mail" required>
                <input type="text" name="pseudo" class="input-field" placeholder="Votre Login" required>
                <input type="password" name="mdp" class="input-field" placeholder=" Votre mot de passe" required>
                <!-- CSRF protégé -->
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="submit" name="sign-in" value="S'inscrire" class="submit-btn">
              </form>
            </div>

            <a href="/Admin">Admin</a>
          </div>
        </div>
      </div>
    </section>

    <script>
      var log = document.getElementById("login");
      var reg = document.getElementById("register");
      var button = document.getElementById("btn")

      document.querySelector("#show-login").addEventListener("click", function(){
        document.querySelector(".popup").classList.add("active");
      });

      document.querySelector(".popup .close-btn").addEventListener("click", function(){
        document.querySelector(".popup").classList.remove("active");
      });

      function register(){
        log.style.left = "-400px";
        reg.style.left = "50px";
        if (button) button.style.left = "110px";
      }

      function login(){
        log.style.left = "50px";
        reg.style.left = "450px";
        if (button) button.style.left = "0";
      }
    </script>
  </body>
</html>
