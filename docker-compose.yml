version: '3.8'

services:
 
  db:
    image: postgres:16-alpine
    container_name: vibes_voyage_db
    environment:
    
      POSTGRES_DB: vibesvoyage
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    volumes:
    
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always


  app:
    
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibes_voyage_app
    ports:
     
      - "8080:8080"
    environment:
    
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vibesvoyage
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devpassword
   
      VIDEO_UPLOAD_PATH: /app/upload/video/ 
    volumes:
    
      - ./upload/video/:/app/upload/video/
    depends_on:
  
      - db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data: